<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showreel - Hubert Dłużniewski</title>
  <meta name="description" content="Selected showreel by Hubert Dłużniewski.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Montserrat:wght@300;400&display=swap&subset=latin-ext" rel="stylesheet">
  <style>
    :root{
      --bg:#f3f0e8;
      --ink:#3f3f3b;
      --heading:#2f2f2c;
      --muted:#8a867f;
      --line:rgba(63,63,59,.16);
      --pad:clamp(22px,3vw,48px);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight","Segoe UI",Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .top{
      position:sticky;top:0;z-index:20;
      display:flex;justify-content:space-between;align-items:center;
      padding:16px var(--pad);
      background:rgba(243,240,232,.9);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line)
    }
    .brand{font-size:10px;letter-spacing:.26em;text-transform:uppercase}
    .nav{display:flex;gap:24px;font-size:9px;letter-spacing:.19em;text-transform:uppercase}
    main{padding:48px var(--pad) 90px}
    .project{
      display:grid;
      grid-template-columns:minmax(250px,.72fr) minmax(0,1.28fr);
      gap:clamp(36px,5vw,78px);
      align-items:start
    }
    .back{
      display:inline-block;
      margin-bottom:28px;
      font-size:9px;
      color:var(--muted);
      letter-spacing:.18em;
      text-transform:uppercase
    }
    .kicker{
      font-size:9px;
      color:var(--muted);
      letter-spacing:.20em;
      text-transform:uppercase;
      margin-bottom:12px
    }
    h1{
      margin:0 0 10px;
      font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;
      font-size:clamp(42px,4.6vw,74px);
      line-height:.95;
      font-weight:300;
      letter-spacing:.03em;
      color:var(--heading)
    }
    .description{
      margin:24px 0 34px;
      font-size:13px;
      line-height:1.65;
      color:var(--muted);
      max-width:440px
    }
    .credits{
      border-top:1px solid var(--line);
      padding-top:15px;
      max-width:440px
    }
    .credit-row{
      display:grid;
      grid-template-columns:minmax(120px,.9fr) 1.1fr;
      gap:16px;
      padding:5px 0;
      font-size:9px;
      line-height:1.45;
      color:var(--muted)
    }
    .credit-label{letter-spacing:.16em;text-transform:uppercase}
    .player{width:100%;aspect-ratio:16/9;background:#111;overflow:hidden}
    .player iframe,.player img{width:100%;height:100%;border:0;display:block;object-fit:cover}
    .placeholder{position:relative;width:100%;height:100%}
    .placeholder::after{
      content:"";
      position:absolute;
      left:18px;
      bottom:18px;
      width:32px;
      height:32px;
      border:1px solid rgba(255,255,255,.95);
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:9px;
      padding-left:2px
    }
    @media(max-width:900px){.project{grid-template-columns:1fr}}
    /* v41: CSS-drawn play icon */
    .play::before{content:"";display:block;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid currentColor;transform:translateX(2px)}
    /* v41: triangle drawn without font glyphs (iOS compatible). */
    .placeholder::before{content:"";position:absolute;left:32px;bottom:29px;width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid white;z-index:1;pointer-events:none}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="../index.html">Hubert Dłużniewski</a>
    <nav class="nav">
      <a href="../index.html#film">Film</a>
      <a href="../index.html#art">Art</a>
      <a href="../index.html#about">About</a>
      <a href="../index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <div class="project">
      <div>
        <a class="back" href="../showreels.html">← Showreels</a>
        <div class="kicker">Selected reel</div>
        <h1 id="reelTitle">SHOWREEL</h1>
        <p class="description" id="reelDescription"></p>
        <div class="credits" id="reelCredits"></div>
      </div>

      <div class="player" id="reelPlayer"></div>
    </div>
  </main>

  <script src="../portfolio-data.js?v=31"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const reels = window.PORTFOLIO_SHOWREELS || [];
    const reel = reels.find(item => item.slug === id) || reels[0];

    if (reel) {
      document.title = `${reel.title} Showreel - Hubert Dłużniewski`;
      document.getElementById("reelTitle").textContent = reel.title || "SHOWREEL";

      const desc = document.getElementById("reelDescription");
      desc.textContent = reel.description || "";
      if (!reel.description) desc.style.display = "none";

      const credits = document.getElementById("reelCredits");
      (reel.credits || []).forEach(([label, value]) => {
        const row = document.createElement("div");
        row.className = "credit-row";
        row.innerHTML = `<div class="credit-label">${label}</div><div>${value}</div>`;
        credits.appendChild(row);
      });
      if (!(reel.credits || []).length) credits.style.display = "none";

      const player = document.getElementById("reelPlayer");
      if (reel.youtube) {
        player.innerHTML = `
          <iframe
            src="https://www.youtube-nocookie.com/embed/${reel.youtube}?rel=0&modestbranding=1&controls=1"
            title="${reel.title}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>`;
      } else {
        player.innerHTML = `
          <div class="placeholder">
            <img src="../assets/${reel.image}" alt="${reel.title}">
          </div>`;
      }
    }
  </script>
</body>
</html>
