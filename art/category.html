<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Selected artworks by Hubert Dłużniewski.">
<title>Art — Hubert Dłużniewski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Montserrat:wght@300;400&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{--bg:#f3f0e8;--ink:#3f3f3b;--heading:#2f2f2c;--muted:#8a867f;--line:rgba(63,63,59,.16);--pad:clamp(22px,3vw,48px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",Arial,sans-serif}
a{color:inherit;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px var(--pad);border-bottom:1px solid var(--line);background:rgba(243,240,232,.92)}
.brand{font-size:10px;letter-spacing:.26em;text-transform:uppercase}.nav{display:flex;gap:clamp(10px,2vw,24px);font-size:9px;letter-spacing:.19em;text-transform:uppercase}
main{padding:58px var(--pad) 100px;min-height:70vh}.back{display:inline-block;margin-bottom:38px;font-size:9px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted)}
.kicker{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h1{font-family:"Montserrat",Arial,sans-serif;font-size:clamp(40px,6vw,90px);line-height:1.03;letter-spacing:-.035em;font-weight:300;margin:0 0 44px;color:var(--heading)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.work{margin:0;min-width:0}.work img{display:block;width:100%;height:auto;background:#e6e0d6}
.work figcaption{padding-top:10px}.work-title{font-size:12px}.work-medium{margin-top:4px;font-size:10px;color:var(--muted)}
  .work-status{
  margin-top:6px;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}
.empty{border-top:1px solid var(--line);padding-top:24px;color:var(--muted);font-size:12px;letter-spacing:.03em}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.top{align-items:flex-start}.nav{gap:10px;flex-wrap:wrap;justify-content:flex-end}.gallery{grid-template-columns:1fr}main{padding-top:40px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="../index.html">Hubert Dłużniewski</a><nav class="nav"><a href="../index.html#film">Film</a><a href="../index.html#art">Art</a><a href="../index.html#about">About</a><a href="../index.html#contact">Contact</a></nav></header>
<main><a class="back" href="../index.html#art">← Back to Art</a><div class="kicker">Selected works</div><h1 id="categoryTitle">ART</h1><div class="gallery" id="gallery"></div><p class="empty" id="empty" hidden>Selected works will be added here soon.</p></main>
<script src="../art-categories.js?v=42"></script>
<script>
const slug=new URLSearchParams(location.search).get('id');
const category=(window.PORTFOLIO_ART_CATEGORIES||[]).find(item=>item.slug===slug);
const title=document.getElementById('categoryTitle');
const gallery=document.getElementById('gallery');
const empty=document.getElementById('empty');
if(!category){title.textContent='CATEGORY NOT FOUND';empty.hidden=false;empty.textContent='Please choose a category from the ART section.';}
else{
  document.title=category.title+' — Hubert Dłużniewski';title.textContent=category.title;
  const works=(window.PORTFOLIO_ART_WORKS||[]).filter(item=>item.category===category.slug);
  works.forEach(work=>{
    const figure=document.createElement('figure');figure.className='work';
    const im=document.createElement('img');im.src='../assets/'+work.image;im.alt=work.title||'Artwork';im.loading='lazy';
    const caption=document.createElement('figcaption');
    const name=document.createElement('div');name.className='work-title';name.textContent=work.title||'';
    const medium=document.createElement('div');medium.className='work-medium';medium.textContent=work.medium||'';
    caption.append(name, medium);

if (work.status) {
  const status = document.createElement('div');
  status.className = 'work-status';
  status.textContent = work.status;
  caption.appendChild(status);
}

figure.append(im, caption);
gallery.appendChild(figure);
  });
  empty.hidden=works.length>0;
}
</script>
</body>
</html>
