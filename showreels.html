<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showreels - Hubert Dłużniewski</title>
  <meta name="description" content="Directing, animation and VFX / online showreels by Hubert Dłużniewski.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Montserrat:wght@300;400&display=swap&subset=latin-ext" rel="stylesheet">
  <style>
    :root{
      --bg:#f3f0e8;
      --ink:#3f3f3b;
      --muted:#8a867f;
      --line:rgba(63,63,59,.16);
      --pad:clamp(22px,3vw,48px);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Inter Tight","Segoe UI",Arial,sans-serif
    }
    a{color:inherit;text-decoration:none}
    .top{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px var(--pad);
      background:rgba(243,240,232,.88);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line)
    }
    .brand{font-size:10px;letter-spacing:.26em;text-transform:uppercase}
    .back{font-size:9px;letter-spacing:.18em;text-transform:uppercase}
    main{padding:72px var(--pad) 100px}
    .intro{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:60px;
      align-items:end;
      margin-bottom:54px
    }
    .kicker{
      font-size:9px;
      letter-spacing:.24em;
      text-transform:uppercase;
      margin-bottom:14px
    }
    h1{
      margin:0;
      color:#2f2f2c;
      font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;
      font-size:clamp(54px,7vw,118px);
      line-height:.9;
      font-weight:300;
      letter-spacing:.12em
    }
    .intro p{
      margin:0;
      max-width:460px;
      justify-self:end;
      font-size:9px;
      line-height:1.45;
      color:var(--muted);
      letter-spacing:.20em;
      text-transform:uppercase
    }
    .reels-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px
    }
    .reel-card{display:block}
    .thumb{
      position:relative;
      
      aspect-ratio:16/9;
      overflow:hidden;
      background:#ddd
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:transform .55s ease,filter .35s ease
    }
    .reel-card:hover .thumb img{
      transform:scale(1.02);
      filter:brightness(.82)
    }
    .play{
      position:absolute;
      left:16px;
      bottom:16px;
      width:38px;
      height:38px;
      border:1px solid rgba(255,255,255,.9);
      border-radius:50%;
      display:grid;
      place-items:center;
      color:white;
      font-size:11px;
      padding-left:2px
    }
    .reel-meta{padding-top:12px}
    .reel-meta h2{
      margin:0 0 5px;
      color:#2f2f2c;
      font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;
      font-size:18px;
      font-weight:300;
      letter-spacing:.08em
    }
    .reel-meta p{
      margin:0;
      color:var(--muted);
      font-size:9px;
      line-height:1.45;
      letter-spacing:.16em;
      text-transform:uppercase
    }
    @media (max-width:850px){
      .intro{grid-template-columns:1fr}
      .intro p{justify-self:start}
      .reels-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">Hubert Dłużniewski</a>
    <a class="back" href="index.html">← Back home</a>
  </header>

  <main>
    <section class="intro">
      <div>
        <div class="kicker">Selected reels</div>
        <h1>SHOWREELS</h1>
      </div>
      <p>Three focused reels covering directing, animation and VFX / online work.</p>
    </section>

    <section class="reels-grid" id="showreelsGrid"></section>
  </main>

  <script src="portfolio-data.js?v=27"></script>
  <script>
    const showreelsGrid = document.getElementById("showreelsGrid");
    const showreels = window.PORTFOLIO_SHOWREELS || [];

    showreels.forEach((reel) => {
      const card = document.createElement("a");
      card.className = "reel-card";
      card.href = reel.link || "#";
      card.innerHTML = `
        <div class="thumb">
          <img src="assets/${reel.image}" alt="${reel.title}">
          <span class="play">▶</span>
        </div>
        <div class="reel-meta">
          <h2>${reel.title}</h2>
          <p>${reel.description}</p>
        </div>`;
      showreelsGrid.appendChild(card);
    });

    if (!showreels.length) {
      showreelsGrid.innerHTML = '<p style="font-size:12px;color:#8a867f">No showreel data found. Check portfolio-data.js.</p>';
    }
  </script>

</body>
</html>
